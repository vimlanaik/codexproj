<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forex Rate Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <p class="eyebrow">Demo</p>
        <h1>Get forex rates</h1>
        <p class="subtitle">Fetch live rates with a quick form.</p>
      </header>

      <section class="card">
        <form id="rate-form" class="form">
          <label class="field">
            Base currency
            <input
              id="base"
              name="base"
              type="text"
              placeholder="USD"
              autocomplete="off"
              maxlength="3"
              value="USD"
              required
            />
          </label>
          <label class="field">
            Target currencies
            <input
              id="symbols"
              name="symbols"
              type="text"
              placeholder="EUR, GBP, JPY"
              autocomplete="off"
              value="EUR, GBP, JPY"
              required
            />
            <span class="hint">Comma-separated list of ISO codes.</span>
          </label>
          <button class="button" type="submit">Get rates</button>
        </form>

        <div class="status" id="status" role="status" aria-live="polite"></div>

        <div class="results" id="results" hidden>
          <div class="results__meta">
            <p id="result-base"></p>
            <p id="result-time"></p>
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>Currency</th>
                <th>Rate</th>
              </tr>
            </thead>
            <tbody id="result-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
